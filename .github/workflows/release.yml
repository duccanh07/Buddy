name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ─── Create the GitHub Release first (once) ────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      upload_url: ${{ steps.create.outputs.upload_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release (draft)
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Buddy ${{ github.ref_name }}"
          draft: true
          prerelease: false
          body: |
            ## Buddy ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ### Downloads

            | Platform | File |
            |----------|------|
            | 🍎 macOS (Apple Silicon M1/M2/M3) | `.dmg` (aarch64) |
            | 🍎 macOS (Intel) | `.dmg` (x64) |
            | 🪟 Windows 64-bit | `.msi` or `_setup.exe` (NSIS) |

  # ─── Build matrix ──────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.label }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            platform: macos-latest
            rust-target: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin"

          - label: macOS-x64
            platform: macos-latest
            rust-target: x86_64-apple-darwin
            tauri-args: "--target x86_64-apple-darwin"

          - label: Windows-x64
            platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.tauri-args }}

      # ── macOS: upload .dmg ────────────────────────────────────────────────
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          DMG=$(find src-tauri/target -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "No .dmg found!" && exit 1
          fi
          BASENAME=$(basename "$DMG")
          gh release upload ${{ github.ref_name }} "$DMG#${BASENAME}" --clobber

      # ── Windows: upload .msi and .exe (NSIS) ─────────────────────────────
      - name: Upload Windows installers
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $msi  = Get-ChildItem -Recurse src-tauri/target -Filter "*.msi"  | Select-Object -First 1
          $exe  = Get-ChildItem -Recurse src-tauri/target -Filter "*-setup.exe" | Select-Object -First 1
          if ($msi)  { gh release upload $env:GITHUB_REF_NAME "$($msi.FullName)#$($msi.Name)" --clobber }
          if ($exe)  { gh release upload $env:GITHUB_REF_NAME "$($exe.FullName)#$($exe.Name)" --clobber }

  # ─── After all builds succeed, publish the release ─────────────────────────
  publish-release:
    name: Publish Release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish (remove draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false --repo ${{ github.repository }}
